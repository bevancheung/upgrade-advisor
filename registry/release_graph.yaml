# Typed release graph, seeded with the checkpoints UpgradeBench measured.
# Edge types: fresh_pretraining | continuation | anneal | soup | unknown
# continuation_tokens: approximate continued-pretraining distance in tokens.
# Sources: model cards / technical reports; "verified" edges come from the
# OLMo documented trajectory, "inferred" from release documentation.
#
# Contributions welcome: add your organization's checkpoints with citations.

checkpoints:
  Qwen/Qwen1.5-7B-Chat:        {family: qwen, released: 2024-02}
  Qwen/Qwen2-7B-Instruct:      {family: qwen, released: 2024-06}
  Qwen/Qwen2.5-7B-Instruct:    {family: qwen, released: 2024-09}
  Qwen/Qwen2.5-7B-Instruct-1M: {family: qwen, released: 2025-01}
  Qwen/Qwen3-8B:               {family: qwen, released: 2025-04}
  allenai/OLMo-1-7B:           {family: olmo, released: 2024-02}
  allenai/OLMo-1.7-7B:         {family: olmo, released: 2024-04}
  allenai/OLMo-2-1124-7B:      {family: olmo, released: 2024-11}
  Qwen/Qwen1.5-1.8B-Chat:      {family: qwen, released: 2024-02}
  Qwen/Qwen2-1.5B-Instruct:    {family: qwen, released: 2024-06}
  Qwen/Qwen2.5-1.5B-Instruct:  {family: qwen, released: 2024-09}
  Qwen/Qwen3-1.7B:             {family: qwen, released: 2025-04}

edges:
  - {source: Qwen/Qwen1.5-7B-Chat, target: Qwen/Qwen2-7B-Instruct,
     type: fresh_pretraining, confidence: inferred,
     note: architecture break; weight-space transfer undefined}
  - {source: Qwen/Qwen2-7B-Instruct, target: Qwen/Qwen2.5-7B-Instruct,
     type: fresh_pretraining, confidence: inferred,
     note: shape-identical but independent run per release docs; measured
           copy retention -0.60..0.78, always below Freeze}
  - {source: Qwen/Qwen2.5-7B-Instruct, target: Qwen/Qwen2.5-7B-Instruct-1M,
     type: continuation, continuation_tokens: 2.0e+10, confidence: inferred,
     note: long-context extension of the same weights; measured copy
           retention 0.82-1.45}
  - {source: Qwen/Qwen2.5-7B-Instruct, target: Qwen/Qwen3-8B,
     type: fresh_pretraining, confidence: inferred,
     note: architecture break}
  - {source: allenai/OLMo-1-7B, target: allenai/OLMo-1.7-7B,
     type: fresh_pretraining, confidence: verified,
     note: model card states trained from scratch; measured copy at or
           below the no-adapter floor}
  # OLMo-2 intra-run edges (fully documented trajectory)
  - {source: "allenai/OLMo-2-1124-7B@stage1-step237000",
     target: "allenai/OLMo-2-1124-7B@stage1-step248000",
     type: continuation, continuation_tokens: 4.6e+10, confidence: verified,
     note: measured copy retention 0.88-0.99}
  - {source: "allenai/OLMo-2-1124-7B@stage1-step237000",
     target: "allenai/OLMo-2-1124-7B@stage1-step928646",
     type: continuation, continuation_tokens: 2.9e+12, confidence: verified,
     note: pure continuation, no anneal/soup; measured copy at the floor}
  - {source: "allenai/OLMo-2-1124-7B@stage1-step928646",
     target: "allenai/OLMo-2-1124-7B@stage2-ingredient3-step11931",
     type: anneal, continuation_tokens: 5.0e+10, confidence: verified}
  - {source: "allenai/OLMo-2-1124-7B@stage2-ingredient3-step11931",
     target: "allenai/OLMo-2-1124-7B",
     type: soup, confidence: verified,
     note: merge of independently annealed branches}
  # Small-scale Qwen track (paper-verified at 1.5-1.8B)
  - {source: Qwen/Qwen1.5-1.8B-Chat, target: Qwen/Qwen2-1.5B-Instruct,
     type: fresh_pretraining, confidence: inferred,
     note: architecture break at small scale}
  - {source: Qwen/Qwen2-1.5B-Instruct, target: Qwen/Qwen2.5-1.5B-Instruct,
     type: fresh_pretraining, confidence: inferred,
     note: shape-identical independent run; paper measured copy retention
           -0.60..0.10 at this scale}
  - {source: Qwen/Qwen2.5-1.5B-Instruct, target: Qwen/Qwen3-1.7B,
     type: fresh_pretraining, confidence: inferred,
     note: architecture break at small scale}
