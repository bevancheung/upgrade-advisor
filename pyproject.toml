[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upgrade-advisor"
version = "0.1.0"
description = "Executable freeze/copy/refresh/retrain recommendations for fine-tuned LLM specialists across base-model releases (UpgradeBench)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
gpu = ["torch>=2.1", "transformers>=4.44", "peft>=0.10", "bitsandbytes>=0.43", "accelerate"]
dev = ["pytest"]

[project.scripts]
upgrade-advisor = "upgrade_advisor.cli:main"

[tool.setuptools]
packages = ["upgrade_advisor"]
