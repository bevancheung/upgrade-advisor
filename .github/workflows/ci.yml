name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -q
      - run: python -c "from upgrade_advisor.genealogy import lookup; v=lookup('Qwen/Qwen2-7B-Instruct','Qwen/Qwen2.5-7B-Instruct'); assert v.edge_type=='fresh_pretraining'"
